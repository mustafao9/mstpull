python3 -c '
content = """name: Build Release Packages (Windows & Linux)

on:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    name: Build Windows EXE & Installer
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 pyinstaller -r requirements.txt

      - name: Download FFmpeg Binary
        shell: powershell
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $url -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_extracted"
          $ffmpegExe = Get-ChildItem -Path "ffmpeg_extracted" -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1 -ExpandProperty FullName
          Copy-Item $ffmpegExe -Destination "ffmpeg.exe"

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller --noconsole --onefile --hidden-import=PyQt6 --hidden-import=PyQt6.QtCore --hidden-import=PyQt6.QtWidgets --hidden-import=PyQt6.QtGui --add-binary "ffmpeg.exe;." --name "mstpull" main.py

      - name: Compile Inno Setup Installer
        shell: powershell
        run: |
          & "C:\\Program Files (x86)\\Inno Setup 6\\ISCC.exe" setup.iss

      - name: Create Release and Upload Assets (Windows)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/mstpull.exe
            Output/MstPull_Setup_*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux-deb:
    name: Build Linux .deb Package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-pyqt6 ffmpeg build-essential devscripts debhelper

      - name: Install Python Requirements
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r requirements.txt

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller --noconsole --onefile --name "mstpull" main.py

      - name: Package .deb File
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          DEB_DIR="mstpull_${VERSION}_amd64"
          
          mkdir -p ${DEB_DIR}/usr/bin
          mkdir -p ${DEB_DIR}/usr/share/applications
          mkdir -p ${DEB_DIR}/DEBIAN
          
          cp dist/mstpull ${DEB_DIR}/usr/bin/mstpull
          chmod +x ${DEB_DIR}/usr/bin/mstpull
          
          cat << DEBCONTROL > ${DEB_DIR}/DEBIAN/control
          Package: mstpull
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Depends: ffmpeg, python3-pyqt6
          Maintainer: Mustafa Satılmış <contact@mustafao9.com>
          Description: Modern media downloader application powered by yt-dlp and PyQt6.
          DEBCONTROL
          
          dpkg-deb --build ${DEB_DIR}
          mv ${DEB_DIR}.deb dist/

      - name: Upload .deb to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
"""

with open(".github/workflows/build_windows.yml", "w", encoding="utf-8") as f:
    f.write(content)
print("[✓] Workflow dosyası başarıyla güncellendi.")
'
