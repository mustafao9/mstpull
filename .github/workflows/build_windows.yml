name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r requirements.txt

      - name: Download FFmpeg Binary
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://github.com/Gharv/ffmpeg-builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_extracted"
          $ffmpegExe = Get-ChildItem -Path "ffmpeg_extracted" -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1 -ExpandProperty FullName
          Copy-Item $ffmpegExe -Destination "ffmpeg.exe"

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller --noconsole --onefile --add-binary "ffmpeg.exe;." --name "mstpull" main.py

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/mstpull.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
